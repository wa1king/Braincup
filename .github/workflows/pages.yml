name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Check repository path
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          test "$REPOSITORY_NAME" = Braincup || { echo 'This app expects a repository named Braincup.'; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build WASM project
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: Prepare and validate website
        env:
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          dist = Path('composeApp/build/dist/wasmJs/productionExecutable')
          for name in ('index.html', '404.html', 'composeApp.js', 'manifest.json'):
              assert (dist / name).is_file(), f'Missing build output: {name}'
          assert list(dist.glob('*.wasm')), 'Missing WebAssembly bundle'
          assert (dist / 'composeResources').is_dir(), 'Missing game resources'
          (dist / 'CNAME').unlink(missing_ok=True)
          (dist / '.nojekyll').touch()
          url = os.environ['PAGE_URL'].rstrip('/') + '/'
          assert url.startswith('https://'), 'Missing HTTPS Pages address'
          for name in ('index.html', '404.html'):
              file = dist / name
              html = file.read_text(encoding='utf-8').replace('https://braincup.app/', url)
              html = html.replace('26 free mini-games', 'Free mini-games').replace('26 mini-games', 'mini-games')
              file.write_text(html, encoding='utf-8')
          file = dist / 'manifest.json'
          manifest = json.loads(file.read_text(encoding='utf-8'))
          manifest['description'] = 'Free math, logic, memory and focus games. Open source.'
          file.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (dist / 'robots.txt').write_text(f'User-agent: *\nAllow: /\nSitemap: {url}sitemap.xml\n', encoding='utf-8')
          (dist / 'sitemap.xml').write_text(f'<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>{url}</loc></url></urlset>\n', encoding='utf-8')
          print(f'Validated Pages website: {url}')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
